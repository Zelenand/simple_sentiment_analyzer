[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analyzer-ru"
version = "1.0.0"
description = "Простой анализатор тональности русского текста"
requires-python = ">=3.10"
dependencies = [
    "pymorphy3>=2.0.0",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "ruwordnet",
    "nltk"
]

[project.scripts]
sentiment-ru = "sentiment_ru.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
